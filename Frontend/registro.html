<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Mi Tienda</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <div class="pagina">
      <header>
        <nav>
          <strong>Mi Tienda</strong>
          <ul class="lista_navegacion">
            <li class="elemento_lista"><a href="index.html">Inicio</a></li>
            <li class="elemento_lista"><a href="catalogo.html">Catalogo</a></li>
            <li class="elemento_lista"><a href="carrito.html">Carrito</a></li>
            <li class="elemento_lista"><a href="pedidos.html">Mis pedidos</a></li>
            <li class="elemento_lista" id="item-admin" hidden><a href="admin.html">Admin</a></li>
            <li class="elemento_lista" id="item-entrar"><a href="login.html">Entrar</a></li>
            <li class="elemento_lista" id="item-registro"><a href="registro.html">Registro</a></li>
            <li class="elemento_lista" id="item-salir" hidden>
              <button id="btn-salir" type="button">Cerrar sesión</button>
            </li>
          </ul>
        </nav>
        <p id="sesion">No has iniciado sesión</p>
      </header>
      <main>
        <h1>Crear cuenta</h1>
        <form id="form-registro">
          <label>Nombre</label><br />
          <input id="nombre" type="text" required /><br />
          <label>Correo</label><br />
          <input id="correo" type="email" required /><br />
          <label>Contraseña</label><br />
          <input id="password" type="password" minlength="8" required /><br />
          <button type="submit">Registrarme</button>
        </form>
        <p id="mensaje"></p>
        <p><a href="login.html">Ya tengo cuenta</a></p>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/registro.js"></script>
  </body>
</html>
