<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Mi Tienda</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <div class="pagina">
      <header>
        <nav>
          <strong>Mi Tienda</strong>
          <ul class="lista_navegacion">
            <li class="elemento_lista"><a href="index.html">Inicio</a></li>
            <li class="elemento_lista"><a href="catalogo.html">Catalogo</a></li>
            <li class="elemento_lista"><a href="carrito.html">Carrito</a></li>
            <li class="elemento_lista"><a href="pedidos.html">Mis pedidos</a></li>
            <li class="elemento_lista" id="item-admin" hidden><a href="admin.html">Admin</a></li>
            <li class="elemento_lista" id="item-entrar"><a href="login.html">Entrar</a></li>
            <li class="elemento_lista" id="item-registro"><a href="registro.html">Registro</a></li>
            <li class="elemento_lista" id="item-salir" hidden>
              <button id="btn-salir" type="button">Cerrar sesión</button>
            </li>
          </ul>
        </nav>
        <p id="sesion">No has iniciado sesión</p>
      </header>
      <main>
        <h1>Administracion</h1>
        <p id="mensaje"></p>

        <section id="bloque-categorias">
          <h2>Categoria</h2>
          <form id="form-categoria">
            <input id="categoria-id" type="hidden" />
            <label>Nombre</label><br />
            <input id="categoria-nombre" type="text" required /><br />
            <label>Descripcion</label><br />
            <input id="categoria-descripcion" type="text" required /><br />
            <button type="submit">Guardar categoria</button>
            <button id="btn-cancelar-categoria" type="button">Cancelar</button>
          </form>
          <table border="1">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Descripcion</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tabla-categorias"></tbody>
          </table>
        </section>

        <section id="bloque-productos">
          <h2>Producto</h2>
          <form id="form-producto">
            <input id="producto-id" type="hidden" />
            <label>Nombre</label><br />
            <input id="producto-nombre" type="text" required /><br />
            <label>Descripcion</label><br />
            <input id="producto-descripcion" type="text" required /><br />
            <label>Precio</label><br />
            <input id="producto-precio" type="number" min="0.01" step="0.01" required /><br />
            <label>Stock</label><br />
            <input id="producto-stock" type="number" min="0" step="1" required /><br />
            <label>Imagen</label><br />
            <input id="producto-imagen" type="text" placeholder="audifonos.jpg" required /><br />
            <label>Categoria</label><br />
            <select id="producto-categoria" required></select>
            <button type="submit">Guardar producto</button>
            <button id="btn-cancelar-producto" type="button">Cancelar</button>
          </form>
          <table border="1">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Descripcion</th>
                <th>Precio</th>
                <th>Stock</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tabla-productos"></tbody>
          </table>
        </section>

        <section id="bloque-pedidos">
          <h2>Pedidos</h2>
          <table border="1">
            <thead>
              <tr>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Fecha</th>
                <th>Total</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody id="tabla-pedidos"></tbody>
          </table>
        </section>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
